<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUNGNINJA technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#121316;
    --panel-2:#17181c;
    --ink:#e8e4df;
    --muted:#8b8d93;
    --line:#232529;
    --blue:#4a9ede;          /* brand blue */
    --blue-deep:#1d3a55;
    --blue-soft:rgba(74,158,222,.12);
    --surf:#3fb6c9;          /* ocean cyan */
    --surf-soft:rgba(63,182,201,.12);
    --bowl:#8f7ae0;          /* lane violet */
    --bowl-soft:rgba(143,122,224,.12);
    --track:#e0a13f;         /* pit-lane amber */
    --track-soft:rgba(224,161,63,.12);
    --in:#4fae7c;
    --out:#d76a5f;
    --maybe:#d3b455;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh;
  }
  #app{width:100%;max-width:460px;margin:0 auto;padding:24px 18px 48px;}

  /* ---------- header ---------- */
  .masthead{margin-bottom:2px;}
  .logo{line-height:1;}
  .logo-img{
    display:block;width:210px;max-width:60vw;height:auto;
  }
  .logo .tech{
    display:block;font-family:"Cormorant Garamond",Georgia,serif;
    font-size:16px;font-weight:600;letter-spacing:.42em;color:var(--blue);
    text-transform:lowercase;margin-top:6px;padding-left:2px;
  }
  .headrow{display:flex;align-items:flex-start;justify-content:space-between;}
  .whoami{font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;padding:8px 0 6px 10px;font-family:inherit;}
  .whoami b{color:var(--blue);font-weight:600;}
  .tagline{font-size:13px;color:var(--muted);margin:10px 0 22px;letter-spacing:.02em;border-left:2px solid var(--blue);padding-left:10px;}

  /* ---------- name gate ---------- */
  .gate{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;margin-top:26px;}
  .gate h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:600;margin-bottom:6px;}
  .gate p{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.55;}
  .gate input{width:100%;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:12px;outline:none;font-family:inherit;}
  .gate input:focus{border-color:var(--blue);}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-block;font-size:15px;font-weight:700;letter-spacing:.03em;
    padding:12px 18px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;
    background:var(--blue);color:#08111a;
  }
  .btn.full{width:100%;}
  .btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink);font-weight:600;}
  .btn:disabled{opacity:.45;cursor:default;}

  /* ---------- new event ---------- */
  .newbar{margin:4px 0 22px;}
  .composer{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:22px;}
  .composer h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600;margin-bottom:14px;}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .acts .act{min-width:calc(50% - 4px);}
  @media(min-width:400px){.acts .act{min-width:0;}}
  .act{
    flex:1;text-align:center;font-size:13.5px;font-weight:700;
    padding:11px 4px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--bg);cursor:pointer;color:var(--muted);font-family:inherit;
  }
  .act.sel-surf{background:var(--surf-soft);border-color:var(--surf);color:var(--surf);}
  .act.sel-bowl{background:var(--bowl-soft);border-color:var(--bowl);color:var(--bowl);}
  .act.sel-track{background:var(--track-soft);border-color:var(--track);color:var(--track);}
  .act.sel-event{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);}
  .composer label{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px;}
  .composer input,.composer textarea{
    width:100%;font-size:16px;padding:11px 13px;border:1.5px solid var(--line);
    border-radius:10px;background:var(--bg);color:var(--ink);outline:none;font-family:inherit;
    color-scheme:dark;
  }
  .composer input:focus,.composer textarea:focus{border-color:var(--blue);}
  .composer textarea{resize:vertical;min-height:56px;}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}
  .composer .actions{display:flex;gap:10px;margin-top:16px;}
  .composer .actions .btn{flex:1;}

  /* ---------- event cards ---------- */
  .empty{
    text-align:center;color:var(--muted);font-size:14.5px;line-height:1.6;
    padding:44px 20px;border:1.5px dashed var(--line);border-radius:14px;
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    margin-bottom:16px;overflow:hidden;
  }
  .card .stripe{height:4px;}
  .stripe.surf{background:linear-gradient(90deg,var(--surf),transparent);}
  .stripe.bowl{background:linear-gradient(90deg,var(--bowl),transparent);}
  .stripe.track{background:linear-gradient(90deg,var(--track),transparent);}
  .stripe.event{background:linear-gradient(90deg,var(--blue),transparent);}
  .card .body{padding:16px 18px 18px;}
  .card .kind{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;padding:4px 9px;border-radius:6px;margin-bottom:8px;
  }
  .kind.surf{background:var(--surf-soft);color:var(--surf);}
  .kind.bowl{background:var(--bowl-soft);color:var(--bowl);}
  .kind.track{background:var(--track-soft);color:var(--track);}
  .kind.event{background:var(--blue-soft);color:var(--blue);}
  .card h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:600;margin-bottom:4px;}
  .meta{font-size:13.5px;color:var(--muted);line-height:1.6;}
  .meta b{color:var(--ink);font-weight:600;}
  .note{font-size:13.5px;margin-top:8px;line-height:1.5;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;}

  .rsvp{display:flex;gap:8px;margin-top:14px;}
  .rsvp button{
    flex:1;font-size:14px;font-weight:700;padding:10px 4px;border-radius:9px;
    border:1.5px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;font-family:inherit;
  }
  .rsvp .on-in{background:rgba(79,174,124,.12);border-color:var(--in);color:var(--in);}
  .rsvp .on-maybe{background:rgba(211,180,85,.12);border-color:var(--maybe);color:var(--maybe);}
  .rsvp .on-out{background:rgba(215,106,95,.12);border-color:var(--out);color:var(--out);}

  .roster{margin-top:12px;font-size:13.5px;line-height:1.7;}
  .roster .grp{color:var(--muted);}
  .roster .grp b{font-weight:700;}
  .roster .grp.g-in b{color:var(--in);}
  .roster .grp.g-maybe b{color:var(--maybe);}
  .roster .grp.g-out b{color:var(--out);}

  .cardfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
  .host{font-size:12px;color:var(--muted);}
  .del{background:none;border:none;font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;font-family:inherit;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--blue);color:#08111a;font-size:13.5px;font-weight:600;
    padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;
    max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;}
  .loading{text-align:center;color:var(--muted);padding:60px 0;font-size:14px;}
  .foot{
    margin-top:34px;text-align:center;font-size:11px;color:#5a5c62;
    letter-spacing:.16em;text-transform:uppercase;
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading the board…</div></div>
<div class="toast" id="toast"></div>

<script>
// Deployed Worker URL (no trailing slash).
const API = 'https://gather-api.sryanjp.workers.dev';
const ME_KEY = 'gather-my-name';          // stored locally on each device
const ACTS = {
  surf:  {label:'Surf',  cls:'surf'},
  bowl:  {label:'Bowling', cls:'bowl'},
  track: {label:'Track race', cls:'track'},
  event: {label:'Event', cls:'event'}
};

let state = { me:null, events:[], composing:false, draftAct:'surf' };
const app = document.getElementById('app');

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function loadMe(){
  try{state.me=localStorage.getItem(ME_KEY)||null;}
  catch{state.me=null;}
}
async function loadEvents(){
  try{
    const r=await fetch(API+'/events');
    if(!r.ok)throw 0;
    state.events=await r.json();
  }catch{/* keep whatever we had; toast only on user actions */}
}
async function api(pathname,opts){
  try{
    const r=await fetch(API+pathname,{
      headers:{'Content-Type':'application/json'},...opts
    });
    if(!r.ok){toast('Could not save — try again');return null;}
    const evts=await r.json();
    if(Array.isArray(evts))state.events=evts;
    return evts;
  }catch(e){toast('No connection — try again');return null;}
}

function fmtDate(d){
  if(!d)return'';
  try{
    const dt=new Date(d+'T00:00:00');
    return dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  }catch{return d;}
}
function upcomingFirst(evts){
  return [...evts].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
}

function render(){
  if(!state.me){renderGate();return;}
  let html=`
    <div class="masthead">
      <div class="headrow">
        ${logoHTML()}
        <button class="whoami" onclick="changeName()">you are <b>${esc(state.me)}</b></button>
      </div>
      <div class="tagline">Surf · bowling · track — one board for the crew.</div>
    </div>
  `;
  if(state.composing){html+=composerHTML();}
  else{html+=`<div class="newbar"><button class="btn full" onclick="openComposer()">+ Propose a session</button></div>`;}

  const evts=upcomingFirst(state.events);
  if(evts.length===0){
    html+=`<div class="empty">Nothing on the board yet.<br>Propose the first session and send the link to the crew.</div>`;
  }else{
    html+=evts.map(cardHTML).join('');
  }
  html+=`<div class="foot">YoungNinja Technology · a NINJA471 experiment</div>`;
  app.innerHTML=html;
}

function renderGate(){
  app.innerHTML=`
    <div class="masthead">${logoHTML()}
      <div class="tagline">Surf · bowling · track — one board for the crew.</div>
    </div>
    <div class="gate">
      <h2>Who's this?</h2>
      <p>Your name shows up next to your RSVPs so the crew knows who's in. Everything posted here is visible to everyone with the link.</p>
      <input id="nameInput" placeholder="e.g. Sean" maxlength="24" autocomplete="off">
      <button class="btn full" onclick="setName()">Join the board</button>
    </div>`;
  const inp=document.getElementById('nameInput');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')setName();});
  inp.focus();
}

function composerHTML(){
  const a=state.draftAct;
  return `
  <div class="composer">
    <h3>New session</h3>
    <div class="acts">
      <button class="act ${a==='surf'?'sel-surf':''}"  onclick="pickAct('surf')">🌊 Surf</button>
      <button class="act ${a==='bowl'?'sel-bowl':''}"  onclick="pickAct('bowl')">🎳 Bowling</button>
      <button class="act ${a==='track'?'sel-track':''}" onclick="pickAct('track')">🏁 Track race</button>
      <button class="act ${a==='event'?'sel-event':''}" onclick="pickAct('event')">✦ Event</button>
    </div>
    <label>Title</label>
    <input id="f-title" placeholder="${a==='surf'?'Dawn patrol at Kizakihama':a==='bowl'?'Friday night lanes':a==='track'?'Stamina race — 5 laps':'BBQ at the house / drinks downtown'}" maxlength="60">
    <div class="row2">
      <div><label>Date</label><input id="f-date" type="date"></div>
      <div><label>Time</label><input id="f-time" type="time"></div>
    </div>
    <label>Place</label>
    <input id="f-place" placeholder="Where are we meeting?" maxlength="60">
    <label>Note (optional)</label>
    <textarea id="f-note" placeholder="Bring gear, backup plan, whatever the crew should know" maxlength="240"></textarea>
    <div class="actions">
      <button class="btn ghost" onclick="closeComposer()">Cancel</button>
      <button class="btn" onclick="postSession()">Post it</button>
    </div>
  </div>`;
}

function cardHTML(ev){
  const act=ACTS[ev.act]||ACTS.surf;
  const my=(ev.rsvps||{})[state.me];
  const grp=(status)=>{
    const names=Object.entries(ev.rsvps||{}).filter(([,s])=>s===status).map(([n])=>esc(n));
    if(!names.length)return'';
    const lbl={in:'In',maybe:'Maybe',out:'Out'}[status];
    return `<div class="grp g-${status}"><b>${lbl} (${names.length})</b> — ${names.join(', ')}</div>`;
  };
  return `
  <div class="card">
    <div class="stripe ${act.cls}"></div>
    <div class="body">
      <span class="kind ${act.cls}">${act.label}</span>
      <h3>${esc(ev.title)}</h3>
      <div class="meta">
        <b>${esc(fmtDate(ev.date))}${ev.time?' · '+esc(ev.time):''}</b>${ev.place?'<br>'+esc(ev.place):''}
      </div>
      ${ev.note?`<div class="note">${esc(ev.note)}</div>`:''}
      <div class="rsvp">
        <button class="${my==='in'?'on-in':''}"    onclick="rsvp('${ev.id}','in')">I'm in</button>
        <button class="${my==='maybe'?'on-maybe':''}" onclick="rsvp('${ev.id}','maybe')">Maybe</button>
        <button class="${my==='out'?'on-out':''}"   onclick="rsvp('${ev.id}','out')">Can't</button>
      </div>
      <div class="roster">${grp('in')}${grp('maybe')}${grp('out')}</div>
      <div class="cardfoot">
        <span class="host">posted by ${esc(ev.by||'?')}</span>
        <button class="del" onclick="delEvent('${ev.id}')">remove</button>
      </div>
    </div>
  </div>`;
}

/* ---------- actions ---------- */
function setName(){
  const v=document.getElementById('nameInput').value.trim();
  if(!v){toast('Enter a name first');return;}
  state.me=v;
  try{localStorage.setItem(ME_KEY,v);}catch{}
  render();
}
function changeName(){
  const v=prompt('Change your name:',state.me);
  if(v&&v.trim()){
    state.me=v.trim();
    try{localStorage.setItem(ME_KEY,state.me);}catch{}
    render();
  }
}
function openComposer(){state.composing=true;render();}
function closeComposer(){state.composing=false;render();}
function pickAct(a){
  state.draftAct=a;
  // keep typed values across re-render
  const keep={};['f-title','f-date','f-time','f-place','f-note'].forEach(id=>{
    const el=document.getElementById(id);if(el)keep[id]=el.value;
  });
  render();
  Object.entries(keep).forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.value=v;});
}
async function postSession(){
  const g=id=>document.getElementById(id).value.trim();
  const title=g('f-title'),date=g('f-date');
  if(!title){toast('Give it a title');return;}
  if(!date){toast('Pick a date');return;}
  const ok=await api('/events',{method:'POST',body:JSON.stringify({
    act:state.draftAct,title,date,time:g('f-time'),place:g('f-place'),note:g('f-note'),by:state.me
  })});
  if(ok){state.composing=false;toast('Posted — you\'re marked in');render();}
}
async function rsvp(id,status){
  const ok=await api('/rsvp',{method:'POST',body:JSON.stringify({eventId:id,name:state.me,status})});
  if(ok)render();
}
async function delEvent(id){
  if(!confirm('Remove this session for everyone?'))return;
  const ok=await api('/events/'+id,{method:'DELETE'});
  if(ok){toast('Removed');render();}
}

/* ---------- boot ---------- */
(async function(){
  loadMe();await loadEvents();
  render();
  // light polling so RSVPs from friends show up while the page is open
  setInterval(async()=>{
    if(state.composing)return;
    const before=JSON.stringify(state.events);
    await loadEvents();
    if(JSON.stringify(state.events)!==before)render();
  },15000);
})();
</script>
</body>
</html>
